<body>
<title>Стартап-квест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: phone-first single column. Home = board-game road (poster colors) with landmarks and a player token;
   mission = illustrated colored header + stacked quest cards. Game feel: confetti, XP pops, level-up and badge reveals. */
:root {
  --bg: #eef2f8;
  --surface: #ffffff;
  --surface-2: #f5f7fc;
  --ink: #172233;
  --ink-soft: #4a586c;
  --line: #d7dfeb;
  --dot: #d3dbe8;
  --c1: #2b95d6; --c2: #e23d4f; --c3: #f0ad1e; --c4: #5fa62d; --c5: #ef7420; --c6: #8a5bbd;
  --good: #1f9d55; --warn: #d48806; --bad: #d4364a;
  --locked: #b8c2d1;
  --road-edge: #172233;
  --font-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1320; --surface: #172131; --surface-2: #1d2a3d; --ink: #e9eef6; --ink-soft: #a9b6c8; --line: #2b3a50; --dot: #1f2b3e;
    --c1: #45a8e6; --c2: #f05768; --c3: #f2b93a; --c4: #79c046; --c5: #f58a3c; --c6: #a27ad6;
    --good: #3cc47a; --warn: #f0a92a; --bad: #f2647a; --locked: #3c4a60; --road-edge: #05080f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1320; --surface: #172131; --surface-2: #1d2a3d; --ink: #e9eef6; --ink-soft: #a9b6c8; --line: #2b3a50; --dot: #1f2b3e;
  --c1: #45a8e6; --c2: #f05768; --c3: #f2b93a; --c4: #79c046; --c5: #f58a3c; --c6: #a27ad6;
  --good: #3cc47a; --warn: #f0a92a; --bad: #f2647a; --locked: #3c4a60; --road-edge: #05080f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  background-image: radial-gradient(var(--dot) 1.4px, transparent 1.6px); background-size: 22px 22px;
}
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 72px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 8vw, 46px); font-weight: 800; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--c1); outline-offset: 2px; }
.muted { color: var(--ink-soft); }
.label { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ico { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; flex: none; }

/* ---------- home */
.hero { display: flex; flex-direction: column; gap: 10px; padding-block: 6px 16px; }
.hero h1 .w1 { color: var(--c2); }
.hero h1 .w2 { display: inline-block; background: var(--c3); color: #1b2333; padding: 0 .25em; border-radius: .2em; transform: rotate(-2deg); }
.rainbow { display: flex; height: 8px; border-radius: 99px; overflow: hidden; }
.rainbow i { flex: 1; }
.xpcard { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; align-items: center; box-shadow: 4px 4px 0 var(--ink); }
.lvl-badge { width: 50px; height: 50px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 20px; grid-row: span 2; color: #fff; background: var(--c6); clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); }
.xpbar { height: 12px; border-radius: 99px; background: var(--surface-2); border: 2px solid var(--ink); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--c3) 0 8px, var(--c5) 8px 16px); transition: width .6s cubic-bezier(.2,.9,.3,1.2); }
.xpnum { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; grid-row: span 2; text-align: right; }
.map { margin-block: 14px 4px; }
.map svg { width: 100%; height: auto; display: block; overflow: visible; }
.map .node { cursor: pointer; }
.map .node.locked { cursor: not-allowed; }
.map .node:focus-visible .ring { stroke: var(--ink); }
.roadflow { animation: flow 1.6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -28; } }
.token { animation: bob 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.twinkle { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: .9; transform: scale(1.1); } }
.pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.rocket-idle { animation: hover 2s ease-in-out infinite; }
@keyframes hover { 0%,100% { translate: 0 0; } 50% { translate: 0 -6px; } }
.flame { animation: flame .25s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center top; }
@keyframes flame { from { transform: scaleY(.8); } to { transform: scaleY(1.15); } }
.stickers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sticker { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 12px; font-weight: 800; min-width: 0; }
.hex { width: 58px; height: 64px; display: grid; place-items: center; clip-path: polygon(50% 0, 96% 25%, 96% 75%, 50% 100%, 4% 75%, 4% 25%); color: #fff; font-size: 28px; }
.sticker.off .hex { background: var(--locked) !important; opacity: .6; }
.sticker.off { color: var(--ink-soft); }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
details.panel summary { cursor: pointer; font-weight: 800; }
details.panel ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.btn { border: 2px solid var(--ink); border-radius: 14px; padding: 12px 18px; font-weight: 800; background: var(--ink); color: var(--bg); box-shadow: 3px 3px 0 var(--c5); transition: transform .12s, box-shadow .12s; }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--c5); }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: 3px 3px 0 var(--line); }
.btn.small { padding: 6px 10px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

/* ---------- mission */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.topbar .xpcard { flex: 1; min-width: 0; max-width: 340px; padding: 8px 12px; box-shadow: 3px 3px 0 var(--ink); }
.topbar .lvl-badge { width: 40px; height: 40px; font-size: 16px; }
.topbar .xpcard .label { display: none; }
.topbar .xpcard b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .xpnum { font-size: 13px; white-space: nowrap; }
.mhead { border-radius: 22px; color: #fff; background: var(--mc); border: 2px solid var(--road-edge); box-shadow: 5px 5px 0 var(--road-edge); overflow: hidden; }
.mhead.dark-text { color: #1b2333; }
.mhead .scene { display: block; width: 100%; height: auto; background: rgba(255,255,255,.12); }
.mhead .mtitle { display: flex; gap: 14px; align-items: center; padding: 14px 18px 18px; }
.mnum { font-family: var(--font-display); font-weight: 800; font-size: 54px; line-height: 1; }
.mhead .label { opacity: .9; }
.mhead h1 { font-size: clamp(21px, 5.4vw, 29px); }
.mprog { display: flex; align-items: center; gap: 10px; padding: 0 18px 16px; font-weight: 800; font-size: 13px; }
.mprog .bar { flex: 1; height: 10px; border-radius: 99px; background: rgba(0,0,0,.18); overflow: hidden; }
.mprog .bar i { display: block; height: 100%; background: currentColor; border-radius: 99px; transition: width .5s; }
.section { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.section > .label { color: var(--mc); display: flex; gap: 8px; align-items: center; }
.coach { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: start; }
.bubble { background: var(--surface-2); border: 2px solid var(--line); border-radius: 4px 18px 18px 18px; padding: 12px 14px; }
.why ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.why li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
.why li b { width: 26px; height: 26px; border-radius: 8px; background: var(--mc); color: #fff; display: grid; place-items: center; font-size: 13px; }
.dict { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.term { border: 2px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface-2); min-width: 0; display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; }
.term .ti { width: 44px; height: 44px; border-radius: 12px; background: var(--mc); color: #fff; display: grid; place-items: center; font-size: 24px; }
.term b { display: block; font-family: var(--font-display); font-size: 14px; font-weight: 600; margin-bottom: 2px; color: var(--mc); }
.q { border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.q p.qt { font-weight: 800; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-weight: 600; transition: transform .1s; }

/* Ключ хранилища не меняется между версиями игры — обновления подхватывают старый прогресс.

const KEY = "startup-quest-v1";

}
function migrate(raw) {
  const f = fresh(), s = Object.assign(fresh(), raw || {});
  ["a", "got", "quiz", "done", "swipe"].forEach(k => { if (!s[k] || typeof s[k] !== "object" || Array.isArray(s[k])) s[k] = f[k]; });
  if (!Array.isArray(s.sales)) s.sales = [];

/* ---------- даты, серия, задания дня */
const pad = n => String(n).padStart(2, "0");
const dstr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => dstr(new Date());
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dstr(d); };
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => (seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296; }
function streakNow() {
  const st = S.streak;
  if (st.last === today()) return { n: st.count, hot: true };
  if (st.last === yesterday()) return { n: st.count, hot: false, warn: true };
  return { n: 0, hot: false };
}
function ensureDaily() {
  const d = today(); if (S.daily.date === d && S.daily.quests.length) return;
  const cur = M.find(m => !S.done[m.id]) || M[7];
  const r = rng(hashStr(d)), pool = DAILY[cur.id].slice(), all = DAILY.all;
  const pick = [];
  while (pick.length < 2 && pool.length) pick.push(pool.splice(Math.floor(r() * pool.length), 1)[0]);
  pick.push(all[Math.floor(r() * all.length)]);
  S.daily = { date: d, quests: pick, done: {} }; save();
}
function touchStreak() {
  const st = S.streak, t = today(); if (st.last === t) return;
  st.count = st.last === yesterday() ? st.count + 1 : 1;
  st.last = t; st.best = Math.max(st.best, st.count); save();
  const bonus = STREAK_BONUS[st.count];
  if (bonus && addXP(bonus, "streak." + st.count)) { confetti(innerWidth / 2, innerHeight / 3, 120); toast("Серия " + st.count + " дн. подряд! +" + bonus + " XP"); }
  else toast("Серия: " + st.count + " дн. подряд!");
}

function mergeState(a, b) {
  const m = migrate(JSON.parse(JSON.stringify(a)));
  m.xp = Math.max(a.xp, b.xp);
  m.got = Object.assign({}, b.got, a.got); m.done = Object.assign({}, b.done, a.done);
  m.swipe = Object.assign({}, b.swipe, a.swipe);
  Object.entries(b.quiz).forEach(([k, v]) => { const c = m.quiz[k]; if (!c || (!c.solved && v.solved)) m.quiz[k] = v; });
  const empty = v => v == null || v === "" || v === false || (Array.isArray(v) && !v.length);
  Object.entries(b.a).forEach(([k, v]) => { if (empty(m.a[k]) && !empty(v)) m.a[k] = v; });
  const key = s => [s.d, s.c, s.p, s.r].join("|"), seen = new Set(m.sales.map(key));
  b.sales.forEach(s => { if (!seen.has(key(s))) { m.sales.push(s); seen.add(key(s)); } });
  if ((b.streak.last || "") > (a.streak.last || "")) m.streak = Object.assign({}, b.streak);
  m.streak.best = Math.max(a.streak.best, b.streak.best, m.streak.count);

/* ================================================================== конфетти */
const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
let parts = [], raf = 0;
const PCOL = ["#2b95d6", "#e23d4f", "#f0ad1e", "#5fa62d", "#ef7420", "#8a5bbd"];
function confetti(x, y, n) {
  if (reduced()) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  for (let i = 0; i < (n || 80); i++) {
    const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 8;
    parts.push({ x: x * dpr, y: y * dpr, vx: Math.cos(a) * sp * dpr, vy: (Math.sin(a) * sp - 6) * dpr, g: .35 * dpr,
      r: (4 + Math.random() * 5) * dpr, c: PCOL[i % 6], rot: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 90 + Math.random() * 40, shape: i % 3 });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => {
    p.vy += p.g; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c; cx.globalAlpha = Math.max(0, Math.min(1, p.life / 30));
    if (p.shape === 0) cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
    else if (p.shape === 1) { cx.beginPath(); cx.arc(0, 0, p.r * .7, 0, 7); cx.fill(); }
    else { cx.beginPath(); cx.moveTo(0, -p.r); cx.lineTo(p.r, p.r); cx.lineTo(-p.r, p.r); cx.fill(); }
    cx.restore();
  });
  parts = parts.filter(p => p.life > 0 && p.y < cv.height + 50);
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if (!raf) cx.clearRect(0, 0, cv.width, cv.height);
}

function mapSVG() {
  const W = 340, step = 112, top = 84, H = top + step * 7 + 120;
  const pts = M.map((m, i) => [i % 2 ? 252 : 88, top + i * step]);
  const seg = i => { const [x0, y0] = pts[i], [x1, y1] = pts[i + 1]; return `M${x0},${y0} C${x0},${y0 + step * .62} ${x1},${y1 - step * .62} ${x1},${y1}`; };
  const finY = H - 46;
  const tail = `M${pts[7][0]},${pts[7][1]} C${pts[7][0]},${pts[7][1] + 60} 170,${finY - 50} 170,${finY}`;
  const all = [0, 1, 2, 3, 4, 5, 6].map(seg).join(" ") + " " + tail;
  let roads = "";
  for (let i = 0; i < 7; i++) roads += `<path d="${seg(i)}" fill="none" stroke="${S.done[M[i].id] ? `var(${M[i].color})` : "var(--locked)"}" stroke-width="30" stroke-linecap="round"/>`;
  roads += `<path d="${tail}" fill="none" stroke="${S.done.m8 ? "var(--c6)" : "var(--locked)"}" stroke-width="30" stroke-linecap="round"/>`;
  const stars = [[24, 40, "--c3"], [318, 120, "--c1"], [22, 270, "--c2"], [320, 390, "--c4"], [28, 530, "--c6"], [314, 650, "--c5"], [26, 770, "--c3"], [316, 870, "--c2"]]
    .map((s, i) => `<path class="twinkle" style="animation-delay:${i * .3}s" d="M${s[0]},${s[1] - 8} l2.5,5.5 5.5,2.5 -5.5,2.5 -2.5,5.5 -2.5,-5.5 -5.5,-2.5 5.5,-2.5 Z" fill="var(${s[2]})"/>`).join("");
  const cur = M.findIndex(m => !S.done[m.id]);
  const nodes = M.map((m, i) => {
    const [x, y] = pts[i], open = unlocked(i), done = !!S.done[m.id];
    const col = open ? `var(${m.color})` : "var(--locked)";
    const prog = open ? missionProgress(m) : 0, C = 2 * Math.PI * 38;
    const lx = i % 2 ? x - 52 : x + 52, anchor = i % 2 ? "end" : "start";
    const ix = i % 2 ? x - 34 : x + 34;
    return `<g class="node ${open ? "" : "locked"}" data-go="${m.id}" tabindex="${open ? 0 : -1}" role="button" aria-label="Миссия ${i + 1}: ${esc(m.title)}${open ? ", прогресс " + prog + "%" : " (закрыта)"}">
      <circle cx="${x}" cy="${y}" r="38" fill="var(--surface)" stroke="var(--road-edge)" stroke-width="3"/>
      ${open && prog ? `<circle class="ring" cx="${x}" cy="${y}" r="38" fill="none" stroke="${col}" stroke-width="6" stroke-dasharray="${(C * prog / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${x} ${y})" stroke-linecap="round"/>` : ""}
      <circle cx="${x}" cy="${y}" r="28" fill="${col}" stroke="var(--road-edge)" stroke-width="3"/>
      ${done ? `<path d="M${x - 11},${y} l7,8 l15,-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`
             : open ? `<text x="${x}" y="${y + 8}" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="800" font-size="22" fill="${m.dark ? "#1b2333" : "#fff"}">${i + 1}</text>`
             : `<path d="M${x - 8},${y - 2} v-5 a8,8 0 0 1 16,0 v5 M${x - 11},${y - 2} h22 v14 h-22 Z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>`}
      <g transform="translate(${ix - 15} ${y - 66})"><rect width="30" height="30" rx="9" fill="var(--surface)" stroke="var(--road-edge)" stroke-width="2.5"/>
        <g transform="translate(3 3)" fill="none" stroke="${col}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${IC[m.icon]}</g></g>
      <text x="${lx}" y="${y - 2}" text-anchor="${anchor}" font-family="Unbounded, sans-serif" font-weight="800" font-size="14" fill="var(--ink)">${esc(m.short)}</text>
      <text x="${lx}" y="${y + 17}" text-anchor="${anchor}" font-family="Manrope, sans-serif" font-weight="700" font-size="12" fill="var(--ink-soft)">${done ? "пройдено" : open ? prog + "% · шаги " + m.steps : "закрыто"}</text>
    </g>`;
  }).join("");
  const tok = cur >= 0 ? `<g class="token">${bottleChar(pts[cur][0] + (cur % 2 ? 40 : -40), pts[cur][1] + 30, .9)}</g>` : "";
  const allDone = cur < 0;
  const finish = `<g data-go="report" class="node" role="button" tabindex="0" aria-label="Демо-день">
    <rect x="96" y="${finY - 20}" width="148" height="40" rx="20" fill="${allDone ? "var(--ink)" : "var(--surface)"}" stroke="var(--road-edge)" stroke-width="3"/>
    <text x="170" y="${finY + 6}" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="800" font-size="13" fill="${allDone ? "var(--bg)" : "var(--ink)"}">ДЕМО-ДЕНЬ</text></g>
    <g class="rocket-idle"><g transform="translate(286 ${finY - 34})">
      <g class="flame"><path d="M-7,28 Q0,60 7,28 Z" fill="#ef7420"/><path d="M-3,28 Q0,46 3,28 Z" fill="#f2b93a"/></g>
      <path d="M-12,8 L-24,30 L-10,25 Z M12,8 L24,30 L10,25 Z" fill="var(--c2)" stroke="var(--road-edge)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M0,-36 C15,-24 17,4 12,28 L-12,28 C-17,4 -15,-24 0,-36 Z" fill="#fff" stroke="var(--road-edge)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="0" cy="-6" r="7" fill="var(--c1)" stroke="var(--road-edge)" stroke-width="2.5"/></g></g>`;
  const start = `<g><rect x="${pts[0][0] - 36}" y="${pts[0][1] - 84}" width="72" height="26" rx="13" fill="var(--c2)" stroke="var(--road-edge)" stroke-width="2.5"/>
    <text x="${pts[0][0]}" y="${pts[0][1] - 66}" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="800" font-size="11" fill="#fff">СТАРТ</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Карта миссий">
    ${stars}
    <path d="${all}" fill="none" stroke="var(--road-edge)" stroke-width="40" stroke-linecap="round"/>
    ${roads}
    <path class="roadflow" d="${all}" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="3" stroke-dasharray="10 18" stroke-linecap="round"/>
    ${start}${nodes}${finish}${tok}</svg>`;
}

/* ---------- карточки событий */
function pickEvent(random) {
  const left = EVENTS.filter(e => S.events.answered[e.id] == null);
  if (!left.length) return null;
  const i = random ? Math.floor(Math.random() * left.length) : hashStr(today()) % left.length;
  return left[i].id;
}
function eventHTML(drawn) {
  let e = EVENTS.find(x => x.id === S.events.cur);
  if (!e) { S.events.cur = pickEvent(false); save(); e = EVENTS.find(x => x.id === S.events.cur); }
  const total = Object.keys(S.events.answered).length;
  if (!e) return `<div class="event"><div class="eh"><span>${ico("dice")} Карточки событий</span><span>${total}/${EVENTS.length}</span></div><div class="eb"><p>Ты прошёл все карточки событий! Новые появятся в следующих обновлениях игры.</p></div></div>`;
  const ans = S.events.answered[e.id], grades = ["bad", "ok", "best"], gname = ["Неудачно", "Так себе", "Отличный ход"];
  return `<div class="event ${drawn ? "drawn" : ""}"><div class="eh"><span>${ico("dice")} Карточка события</span><span>${total}/${EVENTS.length}</span></div>
    <div class="eb"><span class="label muted">${esc(e.step)}</span><p class="situ">${esc(e.s)}</p><p class="muted" style="font-weight:700">Что сделаешь?</p>
    <div class="opts">${e.o.map((o, i) => {
      const cls = ans == null ? "" : i === ans ? (o[1] === 2 ? "right" : "wrong") : "";
      return `<button class="opt ${cls}" data-event="${e.id}|${i}" ${ans != null ? "disabled" : ""}>${esc(o[0])}</button>`;
    }).join("")}</div>
    ${ans != null ? `<div class="outcome ${grades[e.o[ans][1]]}"><b>${gname[e.o[ans][1]]}.</b> ${esc(e.o[ans][2])}</div>
      ${e.o[ans][1] < 2 ? `<p class="hint"><b>Лучший ход:</b> ${esc(e.o.find(o => o[1] === 2)[0])}</p>` : ""}
      <p class="next">${esc(e.lesson)}</p>
      ${pickEvent(true) ? `<button class="btn small" data-act="drawevent" style="align-self:flex-start">${ico("dice")} Вытянуть следующую карточку</button>` : ""}` : ""}
    </div></div>`;
}

/* ---------- легенды бизнеса: карточка в миссии и просмотр в формате «сторис» */

const legendMission = l => M.find(m => m.id === l.m);
function legendHTML(l) {

}
function portraitNote(l) {
  const c = l.av.pt && PORTRAIT_CREDITS[l.av.pt];
  return c ? `<small class="sv-note">Фото: ${esc(c.author)}, ${esc(c.license)} · Wikimedia Commons · векторная обработка</small><small class="sv-note">нажимай справа, чтобы листать</small>`

function openStory(id) {
  const l = LEGENDS.find(x => x.id === id), lm = legendMission(l);
  const part = (icon, title, text) => `<div class="sv-ico">${ico(icon, 2)}</div><div class="sv-k">${esc(title)}</div><p>${rich(text)}</p>`;
  const slides = [
    `<div class="sv-cover">${avatarSVG(l.av, 168, "rgba(255,255,255,.28)")}<span class="chip light">${ico(l.clsIcon)} ${esc(l.cls)}</span><h2>${esc(l.name)}</h2><div class="sv-brand">${esc(l.brand)}</div><p class="sv-hook">«${esc(l.hook)}»</p>${portraitNote(l)}</div>`,
    part("user", "Кем был в начале", l.start),
    part("search", "Что все пропускали", l.pain),
    part("bolt", "Гениальный ход", l.move),
    `<div class="sv-ico">${ico("star", 2)}</div><div class="sv-k">Результат</div><div class="sv-big">${esc(l.big)}</div><p>${rich(l.result)}</p>`,
    `<div class="sv-ico">${ico("flag", 2)}</div><div class="sv-k">Твой ход</div><p class="sv-lesson">${rich(l.lesson)}</p><p class="sv-try"><b>Попробуй сегодня:</b> ${esc(l.try)}</p><p class="sv-xp" id="svxp"></p><button class="btn" data-svclose="1">Готово</button>`
  ];
  const o = document.createElement("div");
  o.className = "storyview" + (lm.dark ? " dk" : ""); o.style.setProperty("--lc", `var(${lm.color})`);
  o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true"); o.setAttribute("aria-label", "История: " + l.name);
  o.innerHTML = `<div class="sv-card"><div class="sv-bars">${slides.map(() => "<i><b></b></i>").join("")}</div>
    <div class="sv-top"><span class="sv-mini">${avatarSVG(l.av, 34, "rgba(255,255,255,.3)")}<b>${esc(l.name)}</b></span><button class="sv-x" aria-label="Закрыть">×</button></div>
    <button class="sv-prev" aria-label="Назад"></button><button class="sv-next" aria-label="Дальше"></button>
    <div class="sv-body" aria-live="polite"></div></div>`;
  document.body.appendChild(o);
  const body = o.querySelector(".sv-body"), bars = o.querySelectorAll(".sv-bars i");
  let i = 0, sx = null, skipClick = false;
  const close = () => {
    o.remove(); document.removeEventListener("keydown", onKey);
    document.querySelectorAll(`.legend[data-lid="${l.id}"]`).forEach(el => { el.outerHTML = legendHTML(l); });
    if (!location.hash || location.hash === "#") renderHome();
    setTimeout(flushLevel, 300);
  };
  const show = n => {
    if (n >= slides.length) return close();
    i = Math.max(0, n);
    body.innerHTML = `<div class="sv-slide">${slides[i]}</div>`;
    bars.forEach((b, k) => { b.className = k < i ? "done" : k === i ? "cur" : ""; });
    sfx.coin();
    if (i === slides.length - 1) {
      const fresh = !S.legends.read[l.id];
      if (fresh) { S.legends.read[l.id] = 1; save(); addXP(10, "legend." + l.id); confetti(innerWidth / 2, innerHeight / 2, 90); }
      const x = body.querySelector("#svxp"); if (x) x.textContent = fresh ? "+10 XP · история добавлена в Зал славы" : "Эта история уже в твоём Зале славы";
      const b = body.querySelector("[data-svclose]"); if (b) { b.addEventListener("click", close); b.focus(); }
    }
  };
  const onKey = e => { if (e.key === "Escape") close(); else if (e.key === "ArrowRight") show(i + 1); else if (e.key === "ArrowLeft") show(i - 1); };
  document.addEventListener("keydown", onKey);
  o.querySelector(".sv-x").addEventListener("click", close);
  o.querySelector(".sv-next").addEventListener("click", () => { if (!skipClick) show(i + 1); });
  o.querySelector(".sv-prev").addEventListener("click", () => { if (!skipClick) show(i - 1); });
  o.addEventListener("click", e => { if (e.target === o) close(); });
  const card = o.querySelector(".sv-card");
  card.addEventListener("pointerdown", e => { sx = e.clientX; skipClick = false; });
  card.addEventListener("pointerup", e => {
    if (sx == null) return; const dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 50) { skipClick = true; show(dx < 0 ? i + 1 : i - 1); setTimeout(() => { skipClick = false; }, 300); }
  });
  show(0);
  o.querySelector(".sv-x").focus();
}

      </ul>

        <li>Раз в неделю — «совет директоров» на 15 минут: что сделано, что узнал, какие цифры.</li>
        <li>После миссии 8 — «демо-день»: ребёнок показывает отчёт и рассказывает, что поменял по ходу.</li>
        <li>Обратите внимание на миссию 7: там ребёнок сам находит риски реплик с логотипами и выбирает законный вариант бизнеса.</li>

}

/* ================================================================== миссия */
function renderMission(id) {
  const idx = M.findIndex(m => m.id === id), m = M[idx];
  if (idx < 0 || !unlocked(idx)) { location.hash = ""; return renderHome(); }
  app.style.setProperty("--mc", `var(${m.color})`);
  const prog = missionProgress(m);
  app.innerHTML = `
  <div class="topbar"><button class="btn ghost" data-go="home">← Карта</button>${xpCard()}${soundBtn()}</div>
  <div class="stack">
    <header class="mhead ${m.dark ? "dark-text" : ""}">
      ${sceneSVG(m.id)}
      <div class="mtitle"><div class="mnum">${idx + 1}</div>
        <div><div class="label">Миссия ${idx + 1} из 8 · шаги MIT ${m.steps}</div><h1>${esc(m.title)}</h1></div></div>
      ${m.boss ? `<div class="boss" id="boss"></div>` : ""}
      <div class="mprog"><span>Прогресс</span><div class="bar"><i id="mbar" style="width:${prog}%"></i></div><span id="mpct">${prog}%</span></div>
    </header>
    <section class="section"><div class="label">${ico("chat")} Коуч говорит</div>
      <div class="coach"><svg width="56" height="64" viewBox="-28 -58 56 64" aria-hidden="true"><g class="token">${bottleChar(0, 0, 1.05)}</g></svg><p class="bubble">${esc(m.coach)}</p></div></section>
    <section class="section why"><div class="label">${ico("target")} Зачем это нужно</div><ul>${m.why.map((w, i) => `<li><b>${i + 1}</b><span>${esc(w)}</span></li>`).join("")}</ul></section>
    <section class="section"><div class="label">${ico("bolt")} Словарик: сложные слова по-простому</div>
      <div class="dict">${m.dict.map(d => `<div class="term"><div class="ti">${ico(d[2] || "star", 2.2)}</div><div><b>${esc(d[0])}</b>${esc(d[1])}</div></div>`).join("")}</div></section>
    <section class="section"><div class="label">${ico("crown")} Легенды бизнеса · +10 XP за историю</div>
      ${LEGENDS.filter(l => l.m === m.id).map(l => legendHTML(l)).join("")}</section>
    <section class="section"><div class="label">${ico("star")} Проверь себя · +10 XP за верный ответ</div>
      ${m.quiz.map((q, qi) => quizHTML(m.id + ".q" + qi, q)).join("")}</section>
    <section class="section"><div class="label">${ico("flag")} Миссия в реальной жизни · +5 XP за поле</div>
      ${m.tasks.map((t, ti) => `<div class="task" data-ti="${ti}">${taskHTML(m, t)}</div>`).join("")}</section>
    <section class="section"><div class="label">${ico("route")} Как это повлияет дальше</div><p class="next">${esc(m.next)}</p></section>
    <div class="done-bar" id="donebar">${doneBar(m, idx)}</div>
  </div>`;
  updateOutputs(); updateBoss(false);
  if (id === "m6") bindDeck();
  window.scrollTo(0, 0);
}
function refreshProgress(m) {
  const p = missionProgress(m), b = document.getElementById("mbar"), t = document.getElementById("mpct");
  if (b) b.style.width = p + "%"; if (t) t.textContent = p + "%";
  document.querySelectorAll(".task[data-ti]").forEach(el => {
    const d = el.querySelector(".done-dot"); if (d) { const on = taskFilled(m, m.tasks[+el.dataset.ti]); d.classList.toggle("on", on); d.textContent = on ? "✓" : ""; }
  });
}
let bossWasDead = false;
function updateBoss(fx) {
  const el = document.getElementById("boss"); if (!el) return;
  const hp = bossHP();
  el.innerHTML = `<div class="row" style="justify-content:space-between"><span>${hp > 0 ? "Здоровье босса" : "Босс повержен!"}</span><span>${hp}%</span></div><div class="hp"><i style="width:${hp}%"></i></div>`;
  const body = document.querySelector(".mhead .scene .boss-body"); if (body) body.style.opacity = hp === 0 ? ".2" : "1";
  if (fx && hp === 0 && !bossWasDead) {
    sfx.win(); confetti(innerWidth / 2, innerHeight / 3, 160);
    addXP(20, "boss"); toast("Мистер Допущение повержен!");
  }
  bossWasDead = hp === 0;
}

function quizHTML(qid, q) {
  const st = S.quiz[qid] || { picked: [], solved: false };
  return `<div class="q" data-q="${qid}"><p class="qt">${esc(q.q)}</p><div class="opts">
    ${q.o.map((o, i) => {
      const cls = st.picked.includes(i) ? (i === q.c ? "right" : "wrong") : "";
      return `<button class="opt ${cls}" data-qopt="${qid}|${i}" ${st.solved ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("")}</div>
    ${st.picked.length ? `<p class="explain">${st.solved ? "<b>Верно!</b> " : "<b>Не совсем.</b> Попробуй ещё. "}${esc(q.e)}</p>` : ""}</div>`;
}

function inp(key, ph, multi) {
  return multi
    ? `<textarea id="f-${key}" data-k="${key}" placeholder="${esc(ph)}">${esc(val(key))}</textarea>`
    : `<input type="text" id="f-${key}" data-k="${key}" placeholder="${esc(ph)}" value="${esc(val(key))}">`;
}
function numInp(key, label, def) {
  return `<label class="f">${esc(label)}<input type="number" inputmode="decimal" id="f-${key}" data-k="${key}" data-num="1" value="${esc(S.a[key] ?? def)}"></label>`;
}

function taskHTML(m, t) {
  const p = m.id + ".", on = taskFilled(m, t);
  const head = `<h3><span class="done-dot ${on ? "on" : ""}">${on ? "✓" : ""}</span>${t.icon ? `<span style="color:var(--mc);display:inline-flex">${ico(t.icon)}</span>` : ""}<span>${esc(t.title)}</span></h3>${t.hint ? `<p class="hint">${esc(t.hint)}</p>` : ""}`;
  switch (t.type) {
    case "text": return head + inp(p + t.key, t.ph, true);
    case "list": return head + `<div class="grid2">${Array.from({ length: t.n }, (_, i) => `<label class="f">${i + 1}${inp(p + t.key + "." + i, t.ph[i])}</label>`).join("")}</div>`;
    case "fields": return head + `<div class="grid2">${t.fields.map((f, i) => `<label class="f">${esc(f[0])}${inp(p + t.key + "." + i, f[1])}</label>`).join("")}</div>`;
    case "grid": return head + Array.from({ length: t.rows }, (_, r) => `<div class="grid2">${t.cols.map((c, ci) => `<label class="f">${r + 1}. ${esc(c[0])}${inp(p + t.key + "." + r + "." + ci, r === 0 ? c[1] : "")}</label>`).join("")}</div>`).join("");
    case "checks": return head + `<div class="checks">${t.items.map((it, i) => { const k = p + t.key + "." + i;
      return `<label><input type="checkbox" id="f-${k}" data-k="${k}" ${S.a[k] ? "checked" : ""}>${esc(it)}</label>`; }).join("")}</div>`;
    case "pick": return head + pickHTML(p + t.key, t);
    case "segscore": return head + segHTML();
    case "tam": return head + `<p class="hint">Цифры для примера — замени своими.</p><div class="grid2">
      ${numInp("tam.people", "Сколько людей на плацдарме", 60)}${numInp("tam.freq", "Сколько флаконов в год покупает один", 2)}${numInp("tam.check", "Средняя цена одного флакона, ₽", 400)}</div>
      <div class="out" data-out="tam"></div>`;
    case "ten": return head + `<div class="tablewrap"><table><thead><tr><th>#</th><th>Имя / класс</th><th>Реакция</th></tr></thead><tbody>
      ${Array.from({ length: 10 }, (_, i) => `<tr><td>${i + 1}</td><td>${inp("ten." + i + ".n", i === 0 ? "Аня, 8А" : "")}</td><td><select id="f-ten.${i}.r" data-k="ten.${i}.r" aria-label="Реакция ${i + 1}">
        ${["", "Куплю!", "Может быть", "Не интересно"].map(o => `<option ${val("ten." + i + ".r") === o ? "selected" : ""}>${o}</option>`).join("")}</select></td></tr>`).join("")}
      </tbody></table></div><div class="out" data-out="ten"></div>`;
    case "value": return head + `<p class="hint">Цифры для примера — замени своими.</p><div class="grid2">
      <label class="f">Аромат, на который похож твой${inp("val.brand", "известный дорогой аромат")}</label>
      ${numInp("val.op", "Цена оригинала, ₽", 12000)}${numInp("val.oml", "Объём оригинала, мл", 100)}${numInp("val.mp", "Твоя цена, ₽", 450)}${numInp("val.mml", "Твой объём, мл", 5)}</div>
      <div class="out" data-out="value"></div>`;
    case "compete": return head + competeHTML();
    case "unit": return head + `<p class="hint">Цифры для примера — замени своими.</p><div class="grid2">
      ${numInp("u.bp", "Цена большого флакона у поставщика, ₽", 6000)}${numInp("u.bml", "Объём большого флакона, мл", 100)}
      ${numInp("u.pack", "Пустой мини-флакон + наклейка, ₽", 35)}${numInp("u.mml", "Объём твоего мини-флакона, мл", 5)}
      ${numInp("u.price", "Твоя цена, ₽", 450)}${numInp("u.rep", "Сколько раз клиент купит за год", 3)}
      ${numInp("u.acq", "Траты на привлечение в месяц (пробники, скидки), ₽", 400)}${numInp("u.newc", "Новых клиентов в месяц", 4)}</div>
      <div class="out" data-out="unit"></div>`;
    case "risks": return head + `<div class="cards">${RISKS.map((r, i) => { const open = !!S.a["risk." + i];
      return `<button class="flip ${open ? "open" : ""}" data-risk="${i}" aria-expanded="${open}" aria-label="${esc(r[0])}${open ? ": " + esc(r[3]) : ""}"><div class="in">
        <div class="face front"><span class="q-mark">?</span><b>${esc(r[0])}</b><span class="muted">Нажми, чтобы проверить</span></div>
        <div class="face back"><span class="tag" style="color:var(--${r[1]})">${esc(r[2])}</span><b>${esc(r[0])}</b><span style="font-size:14px">${esc(r[3])}</span></div></div></button>`; }).join("")}</div>`;
    case "sales": return head + salesHTML();
    case "swipe": return head + swipeHTML();
  }
  return "";
}

function pickHTML(k, t) {
  const sel = S.a[k] || [];
  return `<div class="cards">${t.options.map((o, i) => {
    const on = sel.includes(i), bad = t.pivot && o[2];
    return `<button class="card ${on ? "on" : ""} ${on && bad ? "badpick" : ""}" data-pick="${k}|${i}|${t.max}" aria-pressed="${on}"><span class="ci">${ico(o[4] || "star")}</span><b>${esc(o[0])}</b><span class="muted">${esc(o[1])}</span>
      ${on && t.pivot ? `<span class="verdict ${bad ? "bad" : "good"}">${esc(o[3])}</span>` : ""}</button>`;
  }).join("")}</div>`;
}

const SEGC = ["Есть деньги", "Легко до них дотянуться", "Общаются между собой", "Мало конкурентов"];
function segNames() { return Array.from({ length: 6 }, (_, i) => (val("m1.segs." + i) || "").trim()).map((s, i) => s || M[0].tasks[0].ph[i]); }
function segHTML() {
  const names = segNames();
  return `<div class="tablewrap"><table><thead><tr><th>Группа</th>${SEGC.map(c => `<th>${esc(c)}</th>`).join("")}<th>Сумма</th><th>Плацдарм</th></tr></thead><tbody>
    ${names.map((n, i) => `<tr><td>${esc(n)}</td>${SEGC.map((c, ci) => { const k = "seg." + i + "." + ci;
      return `<td><select id="f-${k}" data-k="${k}" aria-label="${esc(n)}: ${esc(c)}">${["", 1, 2, 3, 4, 5].map(v => `<option ${String(val(k)) === String(v) ? "selected" : ""}>${v}</option>`).join("")}</select></td>`; }).join("")}
      <td data-out="segsum${i}">0</td><td><input type="radio" name="beach" id="f-beach${i}" data-beach="${i}" ${String(S.a.beach) === String(i) ? "checked" : ""} aria-label="Выбрать плацдарм: ${esc(n)}"></td></tr>`).join("")}
  </tbody></table></div><div class="out" data-out="seg"></div>`;
}

const COMP = ["Ты", "Маркетплейс", "Магазин парфюмерии", "Ничего не покупать"];
const COMPDEF = [[7, 9], [9, 1], [2, 6], [10, 0]];
function competeHTML() {
  return `<div class="grid2"><label class="f">Ось 1 (важно для Маши)${inp("cmp.ax", "Доступная цена")}</label><label class="f">Ось 2 (важно для Маши)${inp("cmp.ay", "Можно понюхать до покупки")}</label></div>
  <div>${COMP.map((n, i) => `<div class="slider-row"><b>${esc(n)}</b>
    <div class="sl"><span>Ось 1</span><input type="range" min="0" max="10" id="f-cmp.${i}.x" data-k="cmp.${i}.x" data-num="1" value="${num("cmp." + i + ".x", COMPDEF[i][0])}" aria-label="${esc(n)}: ось 1"><span data-out="cx${i}"></span></div>
    <div class="sl"><span>Ось 2</span><input type="range" min="0" max="10" id="f-cmp.${i}.y" data-k="cmp.${i}.y" data-num="1" value="${num("cmp." + i + ".y", COMPDEF[i][1])}" aria-label="${esc(n)}: ось 2"><span data-out="cy${i}"></span></div></div>`).join("")}</div>
  <div class="plot" data-out="plot"></div>`;
}

function unitCost() { return num("u.bp", 6000) / Math.max(1, num("u.bml", 100)) * num("u.mml", 5) + num("u.pack", 35); }

function salesHTML() {
  const rows = S.sales.map((s, i) => `<tr><td>${esc(s.d)}</td><td>${esc(s.c)}</td><td>${esc(s.p)}</td><td style="font-variant-numeric:tabular-nums">${fmt(s.r)} ₽</td>
    <td><button class="btn ghost small" data-delsale="${i}" aria-label="Удалить продажу">×</button></td></tr>`).join("");
  return `<div class="grid2">
    <label class="f">Клиент (имя)<input type="text" id="sale-c" placeholder="Маша 8Б"></label>
    <label class="f">Аромат<input type="text" id="sale-p" placeholder="Ванильный"></label>
    <label class="f">Цена, ₽<input type="number" inputmode="decimal" id="sale-r" placeholder="450"></label></div>
    <div class="row"><button class="btn" data-act="addsale">Записать продажу</button><span class="muted" id="salemsg"></span></div>
    ${S.sales.length ? `<div class="tablewrap"><table><thead><tr><th>Дата</th><th>Клиент</th><th>Аромат</th><th>Цена</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="hint">Пока продаж нет. Запиши первую — и увидишь статистику.</p>`}
    <div class="out" data-out="sales"></div>`;
}
function salesStats() {
  const by = {};
  S.sales.forEach(s => { const k = s.c.trim().toLowerCase(); by[k] = (by[k] || 0) + 1; });
  const clients = Object.keys(by).length, repeat = Object.values(by).filter(n => n > 1).length;
  const rev = S.sales.reduce((a, s) => a + s.r, 0), cost = unitCost() * S.sales.length;
  return { n: S.sales.length, clients, repeat, rate: clients ? repeat / clients : 0, rev, profit: rev - cost };
}

/* ---------- мини-игра со свайпами */
function swipeHTML() {
  const idx = DEALS.findIndex((d, i) => S.swipe[i] == null);
  const score = Object.keys(S.swipe).filter(i => S.swipe[i]).length;
  if (idx < 0) return `<div class="out"><span class="big">${score} из ${DEALS.length}</span><span>${score >= 5 ? "Отличное чутьё на деньги! Ты видишь, где сделка выгодна, а где съедает прибыль." : "Неплохо. Главное правило: дели траты на число клиентов и сравнивай с прибылью от одного клиента. Нужно хотя бы в 3 раза больше."}</span>
    <button class="btn ghost small" data-act="swipereset" style="align-self:flex-start">Сыграть ещё раз</button></div><p class="hint" id="swipemsg" aria-live="polite"></p>`;
  const d = DEALS[idx], nxt = DEALS[idx + 1];
  return `<div class="deck" id="deck">
    ${nxt ? `<div class="deal back" aria-hidden="true"><div class="d-text">${esc(nxt.t)}</div></div>` : ""}
    <div class="deal" id="deal" data-di="${idx}"><span class="stamp yes">ВЫГОДНО</span><span class="stamp no">В МИНУС</span>
      <div class="d-step">Сделка ${idx + 1} из ${DEALS.length} · верно: ${score}</div>
      <div class="d-text">${esc(d.t)}</div>
      <div class="d-nums"><span>COCA = ${fmt(d.coca)} ₽</span><span>LTV = ${fmt(d.ltv)} ₽</span></div>
    </div></div>
    <div class="swipe-btns"><button class="btn ghost no" data-swipe="0">← В минус</button><button class="btn ghost yes" data-swipe="1">Выгодно →</button></div>
    <p class="hint" id="swipemsg" aria-live="polite">Подсказка: выгодно, если LTV больше или равен 3 × COCA.</p>`;
}
function answerSwipe(yes) {
  const card = document.getElementById("deal"); if (!card || card.dataset.busy) return;
  card.dataset.busy = "1";
  const i = +card.dataset.di, d = DEALS[i], good = d.ltv >= d.coca * 3, ok = yes === good;
  S.swipe[i] = ok; save();
  card.style.transition = "transform .35s, opacity .35s";
  card.style.transform = `translateX(${yes ? 420 : -420}px) rotate(${yes ? 24 : -24}deg)`; card.style.opacity = "0";
  const st = card.querySelector(yes ? ".stamp.yes" : ".stamp.no"); if (st) st.style.opacity = 1;
  if (ok) { sfx.good(); addXP(5, "swipe." + i); } else sfx.bad();
  const note = `<b style="color:var(--${ok ? "good" : "bad"})">${ok ? "Верно!" : "Мимо."}</b> ${good ? `LTV ${fmt(d.ltv)} ₽ ≥ 3 × COCA = ${fmt(d.coca * 3)} ₽ — выгодно.` : `LTV ${fmt(d.ltv)} ₽ меньше, чем 3 × COCA = ${fmt(d.coca * 3)} ₽ — в минус или слишком тонко.`}`;
  const task = card.closest(".task");
  setTimeout(() => {
    const m = M[5];
    if (task) { task.innerHTML = taskHTML(m, m.tasks[0]); const nm = task.querySelector("#swipemsg"); if (nm) nm.innerHTML = note; bindDeck(); }
    if (Object.keys(S.swipe).length === DEALS.length && Object.values(S.swipe).filter(Boolean).length >= 5) confetti(innerWidth / 2, innerHeight / 2, 100);
    refreshProgress(m); refreshDone(m);

function bindDeck() {
  const card = document.getElementById("deal"); if (!card) return;
  let sx = null, dx = 0;
  const yesS = card.querySelector(".stamp.yes"), noS = card.querySelector(".stamp.no");
  card.addEventListener("pointerdown", e => { sx = e.clientX; dx = 0; try { card.setPointerCapture(e.pointerId); } catch (err) {} card.style.transition = "none"; });
  card.addEventListener("pointermove", e => {
    if (sx == null) return; dx = e.clientX - sx;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 14}deg)`;
    yesS.style.opacity = Math.max(0, Math.min(1, dx / 90)); noS.style.opacity = Math.max(0, Math.min(1, -dx / 90));

}

function gauge(ratio) {

  return `<div class="meter"><svg viewBox="0 0 300 150" role="img" aria-label="Шкала LTV к COCA">
    ${arc(0, 1, "var(--bad)")}${arc(1, 3, "var(--warn)")}${arc(3, 5, "var(--good)")}

    const [mid, qk] = qid.split(".q"), m = M.find(x => x.id === mid), q = m.quiz[+qk];
    const st = S.quiz[qid] || { picked: [], solved: false };
    if (st.solved || st.picked.includes(i)) return;
    const first = st.picked.length === 0;
    st.picked.push(i); if (i === q.c) st.solved = true;
    S.quiz[qid] = st; save();
    const r = el.getBoundingClientRect();
    if (st.solved) { sfx.good(); confetti(r.left + r.width / 2, r.top + r.height / 2, 40); if (first) addXP(10, "quiz." + qid); }
    else sfx.bad();
    el.closest(".q").outerHTML = quizHTML(qid, q);
    if (!st.solved) { const nb = document.querySelector(`[data-qopt="${qid}|${i}"]`); if (nb) nb.classList.add("shake"); }
    refreshDone(m); refreshProgress(m);
    return;
  }
  if (el.dataset.pick) {
    const [k, oi, max] = el.dataset.pick.split("|"), i = +oi;
    let sel = (S.a[k] || []).slice();
    if (sel.includes(i)) sel = sel.filter(x => x !== i);
    else { sel.push(i); if (sel.length > +max) sel.shift(); }
    S.a[k] = sel; save();
    const m = M.find(x => k.startsWith(x.id + ".")), t = m.tasks.find(x => m.id + "." + x.key === k);
    const bad = t.pivot && sel.includes(3);
    if (sel.length && !bad) addXP(5, "f." + k);
    if (bad) { sfx.bad(); toast("Опасный вариант! Босс лечится — выбери другой"); shakeHead(); }
    else if (t.pivot && sel.length) sfx.hit();
    el.closest(".cards").outerHTML = pickHTML(k, t);
    refreshDone(m); refreshProgress(m); if (t.pivot) updateBoss(true);
    return;
  }
  if (el.dataset.risk) {
    const i = +el.dataset.risk; if (S.a["risk." + i]) return;
    S.a["risk." + i] = true; save(); sfx.hit(); addXP(5, "f.risk." + i);
    el.classList.add("open"); el.setAttribute("aria-expanded", "true");
    shakeHead();
    refreshDone(M[6]); refreshProgress(M[6]); updateBoss(true);
    return;
  }
  if (el.dataset.beach != null && el.type === "radio") {
    S.a.beach = +el.dataset.beach; save(); addXP(5, "f.beach"); updateOutputs(); refreshProgress(M[0]); return;
  }
  if (el.dataset.delsale != null) {
    S.sales.splice(+el.dataset.delsale, 1); save();
    el.closest(".task").innerHTML = taskHTML(M[7], M[7].tasks[0]); updateOutputs(); refreshProgress(M[7]); return;
  }
  const act = el.dataset.act;
  if (act === "finish") {
    const m = M.find(x => x.id === el.dataset.m), idx = M.indexOf(m);
    S.done[m.id] = 1; save(); sfx.win(); confetti(innerWidth / 2, innerHeight / 3, 160);
    addXP(50, "done." + m.id);
    refreshDone(m);
    showModal(`<div class="hex bigx" style="background:var(${m.color})">${ico(m.icon, 2.2)}</div>
      <div class="label muted">Новый значок</div><h2 style="font-size:24px">${esc(m.badge)}</h2>
      <p class="muted">Миссия ${idx + 1} пройдена! +50 XP. ${idx < 7 ? "Открыта миссия " + (idx + 2) + "." : "Впереди демо-день!"}</p>`,
      idx < 7 ? "Следующая миссия" : "К демо-дню", () => go(idx < 7 ? M[idx + 1].id : "report"), ["На карту", () => go("home")]);
  } else if (act === "addsale") {
    const c = document.getElementById("sale-c").value.trim(), p = document.getElementById("sale-p").value.trim();
    const r = parseFloat(document.getElementById("sale-r").value.replace(",", "."));
    const msg = document.getElementById("salemsg");
    if (!c || !isFinite(r) || r <= 0) { sfx.bad(); msg.textContent = "Укажи имя клиента и цену больше нуля."; return; }
    const repeatBuy = S.sales.some(s => s.c.trim().toLowerCase() === c.toLowerCase());
    S.sales.push({ d: new Date().toLocaleDateString("ru-RU"), c, p, r }); save();
    addXP(5, "sale." + S.sales.length);
    if (repeatBuy) { const rr = el.getBoundingClientRect(); confetti(rr.left + rr.width / 2, rr.top, 60); toast("Повторная покупка! Собаки едят корм"); }
    el.closest(".task").innerHTML = taskHTML(M[7], M[7].tasks[0]); updateOutputs(); refreshProgress(M[7]);
  } else if (act === "drawevent") {
    S.events.cur = pickEvent(true); save(); sfx.hit();
    document.getElementById("eventbox").innerHTML = eventHTML(true);
  } else if (act === "backupcopy") {
    const code = exportCode(), msg = document.getElementById("backupmsg"), box = document.getElementById("importbox");
    const fallback = () => { box.value = code; box.select(); msg.textContent = "Код в поле ниже — скопируй его вручную."; };
    try { navigator.clipboard.writeText(code).then(() => { msg.textContent = "Код скопирован! Сохрани его в заметках или отправь себе."; sfx.good(); }, fallback); } catch (err) { fallback(); }
  } else if (act === "backuprestore") {
    const code = document.getElementById("importbox").value;
    if (!code.trim()) { document.getElementById("backupmsg").textContent = "Сначала вставь код сохранения."; return; }
    applyImport(code, "backupmsg");
  } else if (act === "backuppaste") {
    const msg = document.getElementById("backupmsg");
    try { navigator.clipboard.readText().then(t => applyImport(t, "backupmsg"), () => { msg.textContent = "Браузер не дал прочитать буфер. Вставь код в поле вручную."; }); }
    catch (err) { msg.textContent = "Браузер не дал прочитать буфер. Вставь код в поле вручную."; }
  } else if (act === "saveexport") {
    exportSave();
  } else if (act === "saveimport") {
    document.getElementById("savefile").click();
  } else if (act === "swipereset") {
    S.swipe = {}; save(); el.closest(".task").innerHTML = taskHTML(M[5], M[5].tasks[0]); bindDeck(); refreshProgress(M[5]);
  } else if (act === "copy") {
    const txt = reportText(), msg = document.getElementById("copymsg");
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("reporttext")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = "Текст выделен — скопируй его вручную."; };
    try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = "Скопировано! Отправь в мессенджер."; sfx.good(); }, fallback); } catch (err) { fallback(); }
  } else if (act === "sound") {
    soundOn = !soundOn; try { localStorage.setItem("startup-quest-sound", soundOn ? "on" : "off"); } catch (err) {}
    el.outerHTML = soundBtn(); if (soundOn) sfx.good();
  } else if (act === "reset") {
    const note = document.getElementById("resetnote");
    if (el.dataset.armed) { S = fresh(); save(); renderHome(); toast("Игра начата заново"); }
    else { el.dataset.armed = "1"; el.textContent = "Точно стереть всё?"; note.textContent = "Нажми ещё раз для подтверждения."; }
  }
});

app.addEventListener("keydown", e => {
  const n = e.target.closest && e.target.closest(".node[data-go]");
  if (n && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); n.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});

function onField(e) {
  const el = e.target; const k = el.dataset && el.dataset.k; if (!k) return;
  const v = el.type === "checkbox" ? el.checked : el.value;
  S.a[k] = v; save();
  if (v !== "" && v !== false) addXP(5, "f." + k);
  updateOutputs();
  const id = location.hash.replace("#", ""), m = M.find(x => x.id === id); if (m) refreshProgress(m);
}
app.addEventListener("input", onField);
app.addEventListener("change", e => {
  if (e.target.id === "savefile") {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => applyImport(rd.result, "savemsg");
    rd.onerror = () => { document.getElementById("savemsg").textContent = "Не получилось прочитать файл."; };
    rd.readAsText(f); e.target.value = "";
    return;
  }
  if (e.target.type === "checkbox" || e.target.tagName === "SELECT") onField(e);
});

function refreshDone(m) { const bar = document.getElementById("donebar"); if (bar) bar.innerHTML = doneBar(m, M.indexOf(m)); }

route();
})();
</script>

</body>
</html>
